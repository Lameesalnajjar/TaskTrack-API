<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - TaskTrack</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f1f5f9;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.06);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .top-bar h2 {
            color: #7c3aed;
            font-size: 22px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-nav {
            background-color: #f1f5f9;
            color: #7c3aed;
        }

        .btn-nav:hover {
            background-color: #e2e8f0;
        }

        .btn-logout {
            background-color: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .btn-logout:hover {
            background-color: #ef4444;
            color: white;
        }

        .profile-header {
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            border-radius: 20px;
            padding: 30px;
            color: white;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.15);
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.6);
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .profile-info h3 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .profile-info p {
            font-size: 13px;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.08);
            border-color: #c084fc;
        }

        .stat-card h4 {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 26px;
            font-weight: bold;
            color: #7c3aed;
        }

        .progress-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 15px;
        }

        .progress-box h4 {
            font-size: 14px;
            color: #334155;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-bg {
            background-color: #e2e8f0;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 75%;
            background: linear-gradient(90deg, #c084fc, #8b5cf6);
            border-radius: 10px;
            animation: fillProgress 1.5s ease-out forwards;
        }

        @keyframes fillProgress {
            from { width: 0%; }
            to { width: 75%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h2>Student Profile</h2>
        <div class="nav-links">
            <a href="dashboard.html" class="btn btn-nav">📋 Dashboard</a>
            <button class="btn btn-logout" onclick="window.location.href='login.html'">Logout</button>
        </div>
    </div>

    <div class="profile-header">
        <img src="https://api.dicebear.com/7.x/micah/svg?seed=Lamees&backgroundColor=f1f5f9" alt="Student Avatar" class="avatar">
        <div class="profile-info">
            <h3>Lamees Al-Najjar</h3>
            <p>Software Engineering Student | TaskTrack Active User</p>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h4>Total Tasks</h4>
            <div class="number" id="totalTasksCount">8</div>
        </div>
        <div class="stat-card">
            <h4>Completed</h4>
            <div class="number" style="color: #10b981;">6</div>
        </div>
        <div class="stat-card">
            <h4>Pending</h4>
            <div class="number" style="color: #f59e0b;">2</div>
        </div>
    </div>

    <div class="progress-box">
        <h4>
            <span>Weekly Goal Progress</span>
            <span style="color: #7c3aed; font-weight: bold;">75%</span>
        </h4>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
        </div>
    </div>
</div>

<script>
    async function loadStats() {
        try {
            const response = await fetch('/api/tasks');
            if (response.ok) {
                const tasks = await response.json();
                document.getElementById('totalTasksCount').innerText = tasks.length;
            }
        } catch (e) {
            console.log('Error loading stats', e);
        }
    }
    loadStats();
</script>

</body>
</html>
