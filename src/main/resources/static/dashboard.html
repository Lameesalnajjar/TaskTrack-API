<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TaskTrack</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f1f5f9;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.06);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h2 {
            color: #7c3aed;
            font-size: 22px;
        }

        .add-task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-field {
            flex: 1;
            background-color: #f8fafc;
            border: 1.5px solid #e2e8f0;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .input-field:focus {
            border-color: #8b5cf6;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-add {
            background-color: #8b5cf6;
            color: white;
        }

        .btn-add:hover {
            background-color: #7c3aed;
        }

        .btn-profile {
            background-color: #ede9fe;
            color: #7c3aed;
        }

        .btn-profile:hover {
            background-color: #ddd6fe;
        }

        .btn-logout {
            background-color: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .btn-logout:hover {
            background-color: #ef4444;
            color: white;
        }

        .btn-delete {
            background-color: #fee2e2;
            color: #dc2626;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .btn-delete:hover {
            background-color: #dc2626;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #f1f5f9;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-size: 13px;
        }

        td {
            color: #334155;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Task Management Dashboard</h2>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-profile" onclick="window.location.href='profile.html'">👤 Profile</button>
            <button class="btn btn-logout" onclick="window.location.href='login.html'">Logout</button>
        </div>
    </div>

    <form class="add-task-form" id="addTaskForm">
        <input type="text" id="taskTitle" name="title" class="input-field" placeholder="Enter new task..." required>
        <button type="submit" class="btn btn-add">Add Task</button>
    </form>

    <table>
        <thead>
            <tr>
                <th style="width: 10%;">#</th>
                <th style="width: 70%;">Task Title</th>
                <th style="width: 20%; text-align: center;">Action</th>
            </tr>
        </thead>
        <tbody id="tasksTableBody">
        </tbody>
    </table>
</div>

<script>
    const API_URL = '/api/tasks';

    async function loadTasks() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Failed to fetch data');
            const tasks = await response.json();
            
            const tbody = document.getElementById('tasksTableBody');
            tbody.innerHTML = '';
            
            if (!tasks || tasks.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #94a3b8; padding: 20px;">No tasks available</td></tr>`;
                return;
            }

            tasks.forEach((task, index) => {
                const tr = document.createElement('tr');
                const titleText = typeof task === 'string' ? task : (task.title || task.description || 'Untitled Task');
                tr.innerHTML = `
                    <td style="font-weight: bold; color: #94a3b8;">${index + 1}</td>
                    <td>${titleText}</td>
                    <td style="text-align: center;"><button class="btn-delete" onclick="deleteTask(${index})">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error fetching tasks:', error);
        }
    }

    document.getElementById('addTaskForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const titleInput = document.getElementById('taskTitle');
        const titleValue = titleInput.value.trim();

        if (!titleValue) return;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: titleValue })
            });

            if (response.ok) {
                titleInput.value = '';
                loadTasks();
            } else {
                alert('Failed to add task');
            }
        } catch (error) {
            console.error('Error adding task:', error);
        }
    });

    async function deleteTask(index) {
        try {
            const response = await fetch(`${API_URL}/${index}`, { method: 'DELETE' });
            if (response.ok) {
                loadTasks();
            } else {
                alert('Failed to delete task');
            }
        } catch (error) {
            console.error('Error deleting task:', error);
        }
    }

    loadTasks();
</script>

</body>
</html>
